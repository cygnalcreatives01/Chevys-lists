<style>:root{
  --bg:#F1FAF8; --card:#fff; --ink:#12302C; --muted:#5A7873; --line:#D3E8E3;
  --brand:#0F766E; --brand-d:#0B5A54; --brand-l:#CDEFEA; --leaf:#2B8A3E; --leaf-l:#E3F5E7; --gold:#F59F00;
  --on-brand:#fff; --btn-r:14px; --btn-sm:10px; --chip-r:999px; --radius:16px; --shadow:0 2px 10px rgba(10,70,64,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 90px}

/* header */
header.top{background:var(--brand);color:var(--on-brand);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:0}
.hh{flex-basis:100%;flex-wrap:wrap}
.brand img{width:54px;height:54px;border-radius:14px}
.brand b{font-family:'Fraunces',Georgia,serif;font-size:1.35rem;letter-spacing:.2px}
.brand small{display:block;font-size:.72rem;opacity:.9;margin-top:-2px}
.hh{display:flex;align-items:center;gap:10px;font-size:.85rem}
.hh select{background:#fff;color:var(--ink);border:0;border-radius:10px;padding:5px 8px}
.hh label{display:flex;align-items:center;gap:5px;cursor:pointer}

nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:19}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:6px 10px;overflow-x:auto}
.tab{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;border-radius:12px;font-weight:700;font-size:.82rem;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}.tab i{font-style:normal;font-size:1.15rem}@media(min-width:600px){.tab{flex-direction:row;justify-content:center;gap:6px;font-size:.95rem}}
.tab.on{background:var(--brand-l);color:var(--brand-d)}

/* controls */
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;border:2px solid var(--line);border-radius:14px;padding:11px 14px;background:#fff;outline:none}
.search:focus{border-color:var(--brand)}
.btn{border:0;background:var(--brand);color:var(--on-brand);font-weight:800;padding:10px 16px;border-radius:var(--btn-r)}
.btn:hover{background:var(--brand-d)}
.btn.alt{background:var(--leaf)}
.btn.ghost{background:transparent;color:var(--brand-d);border:2px solid var(--brand-l)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:var(--btn-sm)}
.btn.danger{background:#fff;color:#C92A2A;border:2px solid #FFC9C9}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:var(--chip-r);padding:5px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.num{width:110px;border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff}
.sel{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff}
.muted{color:var(--muted)}
.small{font-size:.85rem}
h2.sec{font-size:1.25rem;margin:20px 2px 8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;position:relative}
.card:hover{border-color:var(--brand-l)}
.card .em{font-size:2rem}
.card h3{font-size:1.05rem}
.card p{margin:0;font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem}
.tag{background:var(--brand-l);color:var(--brand-d);border-radius:8px;padding:2px 7px;font-weight:700}
.tag.g{background:var(--leaf-l);color:#1B7A2E}
.price{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline}
.price b{font-size:1.15rem;color:var(--brand-d)}
.price span{font-size:.8rem;color:var(--muted)}
.fav{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:1.3rem;line-height:1}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,40,38,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
#modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
@media(min-width:700px){#modal{align-items:center;padding:20px}.sheet{border-radius:22px}}
.sheet h2{font-size:1.5rem}
.xbtn{float:right;border:0;background:var(--brand-l);color:var(--brand-d);width:36px;height:36px;border-radius:50%;font-size:1.1rem;font-weight:800}
.costs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.cbox{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.cbox.cur{border-color:var(--brand);background:var(--brand-l)}
.cbox b{display:block;font-size:1.3rem;color:var(--brand-d)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
td.r,th.r{text-align:right}
ol.steps{padding-left:20px;margin:8px 0}
ol.steps li{margin-bottom:7px}
.plan-form{background:var(--bg);border-radius:14px;padding:12px;margin-top:14px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cal-head h2{font-size:1.3rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dow{text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);padding:3px 0}
.day{background:#fff;border:2px solid var(--line);border-radius:12px;min-height:66px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.out{opacity:.4}
.day.today{border-color:var(--gold)}
.day.sel{border-color:var(--brand);background:var(--brand-l)}
.day .n{font-weight:800;font-size:.85rem}
.dots{display:flex;gap:2px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:5px;font-size:.55rem;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.dot.f{background:var(--brand);color:var(--on-brand)}
.day .c{font-size:.65rem;color:var(--muted);margin-top:auto}
@media(max-width:520px){.day{min-height:56px}.dot{width:13px;height:13px;font-size:.5rem}.day .c{display:none}}
.slot{border:2px solid var(--line);border-radius:14px;padding:10px;margin-top:10px;background:#fff}
.slot h3{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.entry{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.entry:last-of-type{border-bottom:0}
.entry a{font-weight:700;cursor:pointer}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}

/* picker list */
.prow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line)}
.prow .t{min-width:0}
.prow b{display:block}
.sugg{background:var(--leaf-l);border-radius:14px;padding:8px 10px;margin:10px 0}

/* shopping */
.shop-sec{margin-top:14px}
.shop-sec h3{display:flex;justify-content:space-between;font-size:1rem;background:var(--brand-l);padding:7px 10px;border-radius:10px;color:var(--brand-d)}
.item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.item input{width:20px;height:20px;accent-color:var(--leaf)}
.item .nm{flex:1}
.item.done .nm{text-decoration:line-through;opacity:.5}
.total{position:sticky;bottom:8px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.note{background:#FFF3BF;border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:12px}
textarea.copy{width:100%;min-height:200px;border:2px solid var(--line);border-radius:12px;padding:10px}
footer{margin-top:30px;font-size:.8rem;color:var(--muted)}

/* spending */
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:8px}
.bar i.over{background:#E03131}
.red{color:#C92A2A;font-weight:700}
.wrow{padding:8px 0;border-bottom:1px solid var(--line)}
.wbars{display:flex;align-items:center;gap:8px;margin-top:3px}
.wb{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.wb i{display:block;height:100%;background:var(--brand);border-radius:6px}
.wb.plan i{background:#8EDDD2}
.wbars span{min-width:105px;text-align:right}
/* timer */
#tbtn{border:0;border-radius:50%;background:transparent;padding:0;width:84px;height:84px;box-shadow:0 3px 10px rgba(0,0,0,.35);margin-left:auto;align-self:flex-start;flex:none;line-height:0}
#tbtn .dial{width:100%;height:100%;display:block}
#thand{transition:transform .25s linear}
#tbtn.busy{animation:tpulse 2s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.28)}}
#tpanel{position:fixed;inset:0;background:rgba(10,40,38,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
#tpanel.open{display:flex}
.tsheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
@media(min-width:700px){#tpanel{align-items:center}.tsheet{border-radius:22px}}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow.done .tt{color:#C92A2A}
.tbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.tbar i{display:block;height:100%;background:var(--leaf)}
#ring{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--brand) 95%,transparent);display:none;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
#ring.on{display:flex;animation:flash 1s infinite alternate}
@keyframes flash{from{background:rgba(15,118,110,.95)}to{background:rgba(245,159,0,.96)}}
.ringbox h2{font-size:2.2rem}
.ringbox p{font-size:1.15rem;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* header buttons, store toggle, gallery */
.hbtn{border:0;background:#fff;color:var(--brand-d);font-weight:800;border-radius:var(--btn-sm);padding:6px 11px;font-size:.85rem}
.hbtn[hidden]{display:none}
.seg{display:flex;gap:6px;margin:8px 0 2px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 8px;font-weight:700;font-size:.82rem;color:var(--muted)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media(min-width:700px){.gal{grid-template-columns:repeat(4,1fr)}}
.gcard{margin:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.gcard img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gcard figcaption{padding:8px 10px;display:flex;flex-direction:column}
.ppre{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;margin-top:10px;background:var(--bg)}
.ppre[hidden]{display:none}
.star{border:0;background:transparent;font-size:1.6rem;color:var(--gold);padding:0 2px}
.strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.strip img{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;flex:none}
@media(max-width:520px){.tab{font-size:.72rem}}

/* app-like layout: safe areas + bottom navigation on phones */
header.top{padding-top:env(safe-area-inset-top)}
@media(max-width:699px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -2px 10px rgba(10,70,64,.12);padding-bottom:env(safe-area-inset-bottom)}
  .tabs-in{padding:4px 6px}
  .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(130px + env(safe-area-inset-bottom))}
  .total{bottom:calc(72px + env(safe-area-inset-bottom))}
}
@media (display-mode: standalone){ body{overscroll-behavior-y:contain} }
#toast{width:max-content;max-width:88vw;text-align:center;border-radius:16px;line-height:1.3}

/* editable shopping rows */
.item2{padding:8px 4px;border-bottom:1px solid var(--line)}
.item2 .r1{display:flex;align-items:center;gap:10px}
.item2 .r1 input{width:20px;height:20px;accent-color:var(--leaf)}
.item2 .nm{flex:1;font-weight:700}
.item2.done .nm{text-decoration:line-through;opacity:.5}
.item2 .r2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 0 30px;font-size:.85rem}
.item2 .num{width:78px;padding:6px 8px;border-radius:10px;font-size:.9rem}
.item2 select{border:2px solid var(--line);border-radius:10px;padding:5px 6px;background:#fff;font-size:.9rem}
.item2 .rs{border:0;background:var(--brand-l);color:var(--brand-d);border-radius:8px;font-weight:800;padding:4px 8px}
.rb{margin-top:12px;border:2px solid var(--brand-l);border-radius:14px;padding:8px 10px}
.rb h3{display:flex;justify-content:space-between;font-size:1rem}
.cl-tick{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed var(--line)}
.cl-tick input{width:22px;height:22px;accent-color:var(--leaf)}
.cl-tick .nm{flex:1}
.cl-tick.done .nm{text-decoration:line-through;opacity:.5}

.hv-btn{border:0;background:#FDE8E8;color:#B42318;border-radius:8px;font-weight:800;width:28px;height:28px;flex:none}
.hv-btn.on{background:var(--brand-l);color:var(--brand-d)}
tr.hv td:not(:last-child){text-decoration:line-through;opacity:.45}

.rrow{border:2px solid var(--line);border-radius:14px;padding:8px;margin-top:8px}
.rrow .rname{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:1rem}
.rline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.rline .num{width:84px;padding:7px 8px}
.rline select,.rrow .rs2{border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.rrow .rs2{margin-top:6px;width:100%}
.rfm{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.rfm input{accent-color:var(--brand)}

.srow{border:2px solid var(--line);border-radius:14px;padding:8px;margin-top:8px}
.srow .r1{display:flex;align-items:center;gap:8px}
.srow .r1 input{width:20px;height:20px;accent-color:var(--leaf)}
.srow .sid{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:10px;padding:7px;background:#fff}
.srow .su{border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.srow .sres{margin-top:4px;color:var(--brand-d)}

.total small{display:block;font-weight:600;font-size:.72rem;opacity:.85}

.card .cph{position:relative;margin:-2px -2px 8px}
.card .cph img{width:100%;height:120px;object-fit:cover;border-radius:12px;display:block}
.card .cph .cem{position:absolute;left:6px;bottom:6px;background:#fffd;border-radius:10px;padding:1px 6px;font-size:1.1rem}
.rcover{width:100%;max-height:240px;object-fit:cover;border-radius:14px;display:block;cursor:pointer}
.miles{display:flex;gap:8px;flex-wrap:wrap}
.mile{display:flex;flex-direction:column;align-items:center;font-size:1.6rem;filter:grayscale(1);opacity:.35;min-width:46px}
.mile small{font-size:.7rem;font-weight:800;color:var(--ink)}
.mile.on{filter:none;opacity:1}
.tocook{background:#fff}
.tcem{font-size:3rem;text-align:center;padding:18px 0 6px;background:var(--brand-l)}

.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scrollx .chip{flex:none;white-space:nowrap}
.sgbox summary{cursor:pointer;list-style:none;font-size:1.05rem}
.sgbox summary::-webkit-details-marker{display:none}
.sgbox summary::after{content:' ▾';color:var(--brand)}
.row .search{min-width:0;flex:1 1 0}
.row [data-act=do-search],.row [data-act=rec-new]{padding-left:14px;padding-right:14px}

.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw{width:44px;height:44px;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);border-radius:50%;padding:0;overflow:hidden;position:relative}
.sw i{position:absolute;inset:0}
.cu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.cu-row input[type=color]{width:64px;height:40px;border:2px solid var(--line);border-radius:10px;padding:2px;background:#fff}

.tour{text-align:center}
.tour-e{font-size:3.4rem;line-height:1.1}
.tour h2{margin-top:2px}
.tour-l{list-style:none;padding:0;margin:0;text-align:left;display:grid;gap:8px}
.tour-l li{background:var(--brand-l);border-radius:12px;padding:9px 12px;font-size:.93rem}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:20px;border-radius:99px}

.ios input,.ios select,.ios textarea{font-size:16px}
.ios .sheet,.ios .tsheet{max-height:92dvh;-webkit-overflow-scrolling:touch}
.ios body,html.ios{-webkit-tap-highlight-color:transparent}
</style>

/* ---------- suggestions ---------- */
// meal: '' | b | l | d | m | g (gulay) | x (dessert)
function suggest(meal, { budget = 0, date = null, n = 3, exclude = [] } = {}) {
  let pool = RECIPES.filter(r => {
    if (exclude.includes(r.id)) return false;
    if (!meal) return true;
    if (meal === 'g') return isVeg(r);
    if (meal === 'x') return isDessert(r);
    return r.m.includes(meal);
  });
  const recent = date ? recentIds(date) : new Set();
  const fresh = pool.filter(r => !recent.has(r.id));
  if (fresh.length >= n) pool = fresh;
  let within = budget ? pool.filter(r => cost(r, state.size) <= budget) : pool;
  if (!within.length && budget) within = pool.slice().sort((a, b) => cost(a, state.size) - cost(b, state.size)).slice(0, n);
  return shuffle(within).slice(0, n);
}

/* ---------- receipt scanner ---------- */
const SKIP_RX = /\b(total|subtotal|sub-total|cash|change|vat|vatable|vat-able|tax|amount|discount|tender(ed)?|card|visa|gcash|maya|items?|tin|pos|invoice|receipt|thank|cashier|terminal|senior|pwd|balance|due|rounding|payment)\b/i;
function parseReceipt(text) {
  const rows = [];
  String(text || '').split('\n').forEach(raw => {
    const line = raw.replace(/[|_~=]/g, ' ').replace(/\s+/g, ' ').trim();
    if (line.length < 4 || SKIP_RX.test(line)) return;
    const m = line.match(/(\d{1,3}(?:,\d{3})+|\d+)[.,](\d{2})\s*[A-Za-z]?$/);
    if (!m) return;
    const amt = parseFloat(m[1].replace(/,/g, '') + '.' + m[2]);
    if (!(amt > 0)) return;
    let name = line.slice(0, m.index).trim(), qty = null, unit = null, mm;
    if ((mm = name.match(/(\d+(?:[.,]\d+)?)\s*(kgs?|kilos?|gm|grams?|g|ltrs?|liters?|l|ml)\b/i))) {
      qty = parseFloat(mm[1].replace(',', '.')); const u = mm[2].toLowerCase();
      unit = /^k/.test(u) ? 'kg' : /^(g|gm|gram)/.test(u) ? 'g' : u === 'ml' ? 'ml' : 'L';
      name = name.replace(mm[0], ' ');
    } else if ((mm = name.match(/(\d+(?:[.,]\d+)?)\s*(?:pcs?|pieces?|x|@|\*)\s*(?:\d+[.,]\d{2})?/i)) && /[x@*]|pcs?|pieces?/i.test(mm[0])) {
      qty = parseFloat(mm[1].replace(',', '.')); unit = 'pc'; name = name.replace(mm[0], ' ');
    } else if ((mm = name.match(/^(\d{1,2})\s+(?=[A-Za-z])/))) {
      qty = parseInt(mm[1]); unit = 'pc'; name = name.replace(mm[0], ' ');
    }
    name = name.replace(/[\d@*#.,:;]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (name.length < 2) return;
    rows.push({ raw: line, name, qty, unit, amt, id: matchIng(name) });
  });
  return rows;
}
const toks = s => (s.toLowerCase().match(/[a-zñ]{3,}/g) || []);
function matchIng(name) {
  const t = new Set(toks(name)); if (!t.size) return null;
  let best = null, bs = 0;
  Object.keys(ING).forEach(id => {
    const n = toks(ING[id][0]); const hit = n.filter(w => t.has(w) || [...t].some(x => x.length > 4 && w.length > 4 && (x.startsWith(w) || w.startsWith(x)))).length;
    if (!hit) return;
    const sc = hit / n.length + hit;
    if (sc > bs) { bs = sc; best = id; }
  });
  return best;
}
function scRowHtml(r, i) {
  const id = r.id, us = id ? unitsFor(id) : ['g', 'kg', 'ml', 'L', 'pc'];

function loadTess() {

    if (window.Tesseract) return res(window.Tesseract);
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => (window.Tesseract ? res(window.Tesseract) : rej(new Error('x'))); s.onerror = () => rej(new Error('offline'));
    document.head.appendChild(s); setTimeout(() => rej(new Error('timeout')), 20000);
  });
}

  scopeDates().forEach(k => SLOTS.forEach(s => planGet(k, s).forEach(id => { add(RMAP[id], state.size); meals++; })));
  state.cart.forEach(c => add(RMAP[c.id], c.n));
  Object.keys(state.extra).forEach(id => { if (ING[id]) acc[id] = (acc[id] || 0) + state.extra[id]; });

let actx = null, ringH = null;
function ensureAudio() {

}

function beepOnce() {

function idbOpen() {

    try {

      rq.onupgradeneeded = () => rq.result.createObjectStore('photos', { keyPath: 'id' });
      rq.onsuccess = () => res(rq.result);

}
function idbDo(mode, fn) {
  return new Promise(res => {
    if (!idb) return res(null);
    try {
      const tx = idb.transaction('photos', mode);
      const r = fn(tx.objectStore('photos'));
      tx.oncomplete = () => res(r && r.result !== undefined ? r.result : true);
      tx.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}

function resizeImage(file, max = 900) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

    <h2>📲 ${esc(appName())}</h2><p class="muted small" style="margin:2px 0 10px">Version ${APP_VERSION}${STANDALONE ? ' · downloaded copy' : ''}</p>
    <div class="panel" style="box-shadow:none;border:2px solid var(--brand);margin-top:0"><h3>📱 Put it on my home screen</h3>
      ${isInstalled() ? '<p class="small" style="margin:4px 0 0">✓ You are already using it as an app.</p>' : `
      <p class="muted small" style="margin:4px 0 8px">Open the app link in your phone browser, then add it to your home screen. It opens full screen with its own icon, like a real app.</p>
      ${IS_IOS ? `<ol class="small" style="padding-left:20px;margin:6px 0 0;display:grid;gap:6px"><li>Open the app link in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow ⬆️) at the bottom.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. The ${esc(appName())} icon appears on your home screen.</li></ol>` : '<button class="btn" data-act="install">Install app</button>'}
      <ul class="small" style="padding-left:18px;margin:10px 0 0"><li><b>Android (Chrome):</b> tap ⋮ → <i>Install app</i> or <i>Add to Home screen</i>.</li>
      <li><b>iPhone (Safari):</b> tap the Share icon → <i>Add to Home Screen</i>.</li>
      <li><b>Computer:</b> in Chrome or Edge, click the install icon in the address bar.</li></ul>`}</div>
    <div class="panel" style="box-shadow:none;border:2px solid var(--line)"><h3>Share the app</h3>
      <p class="muted small" style="margin:4px 0 8px">Send the link to family and friends. Each person keeps their own plan, gallery and spending on their own device.</p>
      <div class="row"><button class="btn" data-act="share-app">Share…</button><button class="btn ghost" data-act="share-copy">🔗 Copy link</button></div></div>
    <div class="panel" style="box-shadow:none;border:2px solid var(--line)"><h3>Download</h3>
      <p class="muted small" style="margin:4px 0 8px">Save the whole app as one file (<b>chevys-lists.html</b>). Send it by Messenger, Viber or email and open it in any browser.</p>
      <button class="btn" data-act="dl-app">⬇️ Download app file</button></div>
    <div class="panel" style="box-shadow:none;border:2px solid var(--line)"><h3>Update</h3>
      <p class="small" id="updmsg" style="margin:4px 0 8px">Tap the button to see if there is a newer version.</p>
      <button class="btn alt" data-act="upd-check">🔄 Check for updates</button></div>
    <div class="panel" style="box-shadow:none;border:2px solid var(--line)"><h3>Transfer my data</h3>
      <p class="muted small" style="margin:4px 0 8px">Move your meal plan, spending, prices and favorites to another phone or browser: copy the code here, then paste it there and tap Restore. (Photos are not included.)</p>
      <button class="btn" data-act="bk-copy">📋 Copy backup code</button>
      <textarea class="copy" id="bcode" placeholder="Paste a backup code here" style="min-height:70px;margin-top:10px"></textarea>
      <button class="btn ghost" data-act="bk-restore" style="margin-top:8px">Restore from code</button></div>`);
  if (STANDALONE) checkUpdate(false);
}

/* ---------- render router ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === ui.tab));
  ({ recipes: renderRecipes, planner: renderPlanner, shop: renderShop, spend: renderSpend, gallery: renderGallery, prices: renderPrices })[ui.tab]();
}

/* ---------- events ---------- */
document.addEventListener('pointerdown', ensureAudio, { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (e.target.id === 'modal') closeModal(); return; }
  const a = t.dataset.act, d = t.dataset;
  switch (a) {
    case 'tab': ui.tab = d.tab; closeModal(); render(); window.scrollTo(0, 0); break;
    case 'open': openRecipe(d.id); break;
    case 'close': closeModal(); break;
    case 'fav': {
      e.stopPropagation();
      const i = state.favs.indexOf(d.id);
      if (i >= 0) state.favs.splice(i, 1); else state.favs.push(d.id);
      save();
      if (d.modal) openRecipe(d.id); else if (ui.tab === 'recipes') { renderResults(); renderSugg(); }
      break;
    }
    case 'chip': {
      const k = d.k;
      if (k.startsWith('meal:')) ui.meal = k.slice(5); else ui[k] = !ui[k];
      renderRecipes();
      break;
    }
    case 'suggest': {
      const b = Number($('#sgBudget').value) || 0;
      ui.sgMeal = $('#sgMeal').value; ui.sgBudget = b || '';
      ui.sgList = suggest(ui.sgMeal, { budget: b, n: 3 });
      renderSugg();
      if (!ui.sgList.length) $('#sugg').innerHTML = '<p class="muted">Walang pasok sa budget. Try a higher amount.</p>';
      break;
    }
    case 'cart-add': state.cart.push({ id: d.id, n: state.size }); save(); openToBuy(d.id); break;
    case 'have': {
      if (state.have[d.id]) delete state.have[d.id]; else state.have[d.id] = true;
      save();
      if (d.ctx === 'recipe') { const y = $('#sheet').scrollTop; openRecipe(d.rid); $('#sheet').scrollTop = y; }
      else if (d.ctx === 'shop') renderShop();
      else if (d.ctx === 'one') { const y = $('#sheet').scrollTop; openToBuy(ui.cl.rid); $('#sheet').scrollTop = y; }
      else refreshCL();
      break;
    }
    case 'have-clear': state.have = {}; save(); if (d.ctx === 'shop') renderShop(); else refreshCL(); break;
    case 'rec-new': openRecForm(); break;
    case 'rec-edit': openRecForm(d.id); break;
    case 'rec-save': saveRec(); break;
    case 'rec-del': delRec(d.id); break;
    case 'rr-add': $('#rrows').insertAdjacentHTML('beforeend', recRow()); break;
    case 'rr-del': { const row = t.closest('.rrow'); if ($('#rrows').children.length > 1) row.remove(); else row.querySelectorAll('input').forEach(x => { x.value = ''; }); break; }
    case 'scan-open': openScan(); break;
    case 'scan-cam': $('#rcfile').click(); break;
    case 'scan-gal': $('#rcfile2').click(); break;
    case 'sc-manual': ui.sc.rows = [{ raw: 'Item', name: 'Item', id: null, on: true, qty: null, unit: 'kg', amt: null }]; scRender(); break;
    case 'sc-add': scCollect(); ui.sc.rows.push({ raw: 'Item', name: 'Item', id: null, on: true, qty: null, unit: 'kg', amt: null }); scRender(); break;
    case 'sc-store': scCollect(); ui.sc.store = d.v; scRender(); break;
    case 'sc-apply': applyScan(); break;
    case 'photo-cover': { const g = gallery.find(x => x.id === d.id); if (g && g.rid) { state.covers[g.rid] = g.id; save(); openPhoto(g.id); toast('✓ Now the photo of this recipe'); } break; }
    case 'gview': ui.gview = d.v; renderGallery(); break;
    case 'do-search': { const q = $('#q'); if (q) { ui.q = q.value; renderResults(); q.blur(); const r = $('#results'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break; }
    case 'clear-filters': ui.meal = ''; ui.tipid = ui.veg = ui.gulay = ui.dessert = ui.fav = ui.mine = false; ui.maxb = 0; renderRecipes(); renderResults(); break;
    case 'cust-open': openCustomize(); break;
    case 'cu-preset': { const p = PRESETS[+d.i]; Object.assign(ui.themeDraft, { brand: p[1], accent: p[2], bg: p[3] }); applyTheme(ui.themeDraft); $('#sheet').innerHTML = custHtml(); break; }
    case 'cu-shape': ui.themeDraft.shape = d.v; applyTheme(ui.themeDraft); $('#sheet').innerHTML = custHtml(); break;
    case 'cu-reset': ui.themeDraft = Object.assign({}, THEME0); theme = Object.assign({}, THEME0); LS.set('theme', theme); applyTheme(theme); $('#sheet').innerHTML = custHtml(); toast('Back to the original look'); break;
    case 'cu-save': theme = Object.assign({}, ui.themeDraft); ui.themeDraft = null; LS.set('theme', theme); applyTheme(theme); closeModal(); toast('✓ Saved on this device'); break;
    case 'tour-open': openTour(); break;
    case 'tour-next': ui.tour = Math.min(TOUR.length - 1, ui.tour + 1); renderTour(); $('#sheet').scrollTop = 0; break;
    case 'tour-prev': ui.tour = Math.max(0, ui.tour - 1); renderTour(); $('#sheet').scrollTop = 0; break;
    case 'tour-go': { const tb = document.querySelector(`[data-tab="${d.tab}"]`); closeModal(); if (tb) tb.click(); window.scrollTo(0, 0); break; }
    case 'tour-close': LS.set('tourSeen', 1); closeModal(); break;
    case 'lang': setLang(LANG === 'tl' ? 'en' : 'tl'); break;
    case 'cl-open': openChevyList(); break;
    case 'cl-filter': ui.clf = d.v; refreshCL(); break;
    case 'qty-reset': delete state.qov[d.id]; save(); renderShop(); break;
    case 'qty-reset-all': state.qov = {}; save(); renderShop(); break;
    case 'cart-del': state.cart.splice(Number(d.i), 1); save(); if (d.cl) refreshCL(); else renderShop(); break;
    case 'plan-from-modal': {
      const date = $('#pdate').value, slot = $('#pslot').value;
      if (!date) { $('#pmsg').textContent = 'Pick a date first.'; break; }
      planAdd(date, slot, d.id);
      ui.sel = date; const dt = parseKey(date); ui.calY = dt.getFullYear(); ui.calM = dt.getMonth();
      $('#pmsg').textContent = `✓ Added to ${MEALS[slot].n} on ${dateLabel(date)}.`;
      break;
    }
    case 'cal-prev': ui.calM--; if (ui.calM < 0) { ui.calM = 11; ui.calY--; } renderPlanner(); break;
    case 'cal-next': ui.calM++; if (ui.calM > 11) { ui.calM = 0; ui.calY++; } renderPlanner(); break;
    case 'cal-today': { const n = new Date(); ui.calY = n.getFullYear(); ui.calM = n.getMonth(); ui.sel = todayKey(); renderPlanner(); break; }
    case 'day': { ui.sel = d.k; const dt = parseKey(d.k); ui.calY = dt.getFullYear(); ui.calM = dt.getMonth(); renderPlanner(); break; }
    case 'slot-add': openPicker(ui.sel, d.s); break;
    case 'slot-del': planRemove(ui.sel, d.s, Number(d.i)); renderPlanner(); break;
    case 'pick': {
      if (!ui.pick) break;
      planAdd(ui.pick.date, ui.pick.slot, d.id);
      closeModal(); render();
      break;
    }
    case 'surprise': {
      if (!ui.pick) break;
      const { date, slot, budget } = ui.pick;
      const r = suggest(slot, { budget: Number(budget) || 0, date, n: 1 })[0];
      if (r) { planAdd(date, slot, r.id); closeModal(); render(); }
      break;
    }
    case 'autoplan': {
      const n = autoplan();
      renderPlanner();
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = n ? `✨ Added ${n} meal${n === 1 ? '' : 's'} to the week. Tap any day to change them.` : 'All slots this week are already filled.';
      $('#daypanel').prepend(note);
      break;
    }
    case 'scope': ui.scope = d.k; renderShop(); break;
    case 'uncheck': state.checked = {}; save(); renderShop(); break;
    case 'copy': {
      const text = listText();
      const fallback = () => { showModal(`<button class="xbtn" data-act="close">✕</button><h2>Copy your list</h2><p class="muted small">Select all and copy.</p><textarea class="copy" id="ctext" readonly></textarea>`); $('#ctext').value = text; };
      try { navigator.clipboard.writeText(text).then(() => { t.textContent = '✓ Copied'; }, fallback); } catch (err) { fallback(); }
      break;
    }
    case 'store': state.store[d.sec] = d.v; save(); renderShop(); break;
    case 'store-all': Object.keys(SECTIONS).forEach(k => { state.store[k] = d.v; }); save(); renderShop(); break;
    case 'items-open': openItems(); break;
    case 'isec': ui.items.sec = d.k; refreshItems(); break;
    case 'item-add': { const id = d.id; state.extra[id] = (state.extra[id] || 0) + extraStep(id); save(); refreshItems(); toast('Added: ' + ING[id][0]); break; }
    case 'extra-inc': state.extra[d.id] = (state.extra[d.id] || 0) + extraStep(d.id); save(); renderShop(); break;
    case 'extra-dec': {
      const v = (state.extra[d.id] || 0) - extraStep(d.id);
      if (v <= 0) delete state.extra[d.id]; else state.extra[d.id] = v;
      save(); renderShop(); break;
    }
    case 'extra-del': delete state.extra[d.id]; save(); renderShop(); break;
    case 'log-trip': {
      const { items } = shopData();
      const ticked = items.filter(i => state.checked[i.id]);
      const amt = Math.round((ticked.length ? ticked : items).reduce((s, i) => s + i.cost, 0));
      const smCost = (ticked.length ? ticked : items).filter(i => storeOf(i.sec) === 's').reduce((s, i) => s + i.cost, 0);
      const tripCat = smCost > amt / 2 ? 'Supermarket' : 'Palengke';
      showModal(`<button class="xbtn" data-act="close">✕</button><h2>💸 Log shopping trip</h2>
        <p class="muted small" style="margin:2px 0 10px">${ticked.length ? 'Total of the items you ticked.' : 'Total of the whole list.'} Change it to the real amount you paid.</p>
        <div class="row"><input class="sel" type="date" id="tdate" value="${todayKey()}"><input class="num" id="tamt" type="number" min="0" inputmode="decimal" value="${amt}"></div>
        <div class="row" style="margin-top:8px"><input class="search" id="tlab" value="Palengke / grocery trip"><select class="sel" id="tcat">${EXP_CATS.map(c => `<option ${c === tripCat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
        <div class="row" style="margin-top:12px"><button class="btn" data-act="trip-save">Save to Gastos</button></div>`);
      break;
    }
    case 'trip-save': {
      const amt = parseFloat($('#tamt').value);
      if (!(amt > 0)) { toast('Enter the amount first'); break; }
      addExpense($('#tdate').value || todayKey(), $('#tlab').value, amt, $('#tcat').value);
      closeModal(); toast('Saved to Gastos ✓');
      break;
    }
    case 'exp-add': {
      const amt = parseFloat($('#eamt').value);
      if (!(amt > 0)) { toast('Enter the amount first'); break; }
      const date = $('#edate').value || todayKey();
      addExpense(date, $('#elabel').value, amt, $('#ecat').value);
      const dt = parseKey(date); ui.exY = dt.getFullYear(); ui.exM = dt.getMonth();
      renderSpend(); toast('Saved ✓');
      break;
    }
    case 'exp-del': state.expenses = state.expenses.filter(x => x.id !== d.id); save(); renderSpend(); break;
    case 'ex-prev': ui.exM--; if (ui.exM < 0) { ui.exM = 11; ui.exY--; } renderSpend(); break;
    case 'ex-next': ui.exM++; if (ui.exM > 11) { ui.exM = 0; ui.exY++; } renderSpend(); break;
    case 'reset-prices': state.prices = {}; save(); renderPrices(); break;
    /* timers */
    case 't-open': openTimerPanel(); break;
    case 't-close': $('#tpanel').classList.remove('open'); break;
    case 't-preset': addTimer(($('#tlabel').value || '').trim() || 'Timer', Number(d.s)); $('#tlabel').value = ''; break;
    case 't-custom': {
      const sec = (Number($('#tmin').value) || 0) * 60 + (Number($('#tsec').value) || 0);
      if (sec <= 0) { toast('Enter minutes or seconds'); break; }
      addTimer(($('#tlabel').value || '').trim() || 'Timer', sec);
      $('#tlabel').value = ''; $('#tmin').value = ''; $('#tsec').value = '';
      break;
    }
    case 't-test': ensureAudio(); beepOnce(); break;
    case 't-plus': { const x = state.timers.find(q => q.id === d.id); if (x) { x.endAt += 60000; x.total += 60; x.done = false; save(); renderTimerList(); showRing(); if (!state.timers.some(q => q.done)) stopRing(); } break; }
    case 't-del': state.timers = state.timers.filter(q => q.id !== d.id); save(); renderTimerList(); if (!state.timers.some(q => q.done)) { stopRing(); showRing(); } break;
    case 'timer-step': {
      const r = RMAP[d.id], i = Number(d.i);
      const mins = stepMinutes(r.s[i]);
      if (mins > 0) { addTimer(`${r.n} – step ${i + 1}`, Math.round(mins * 60)); openTimerPanel(); toast('Timer started ⏱'); }
      break;
    }
    case 'photo-new': openAddPhoto(d.rid); break;
    case 'photo': openPhoto(d.id); break;
    case 'star': {
      ui.photo.stars = ui.photo.stars === Number(d.n) ? 0 : Number(d.n);
      document.querySelectorAll('#pstars .star').forEach((b, i) => { b.textContent = i < ui.photo.stars ? '★' : '☆'; });
      break;
    }
    case 'photo-save': {
      if (!ui.photo || !ui.photo.img) { toast('Choose a photo first'); break; }
      const rid = $('#prid').value;
      const title = rid ? RMAP[rid].n : ($('#ptitle').value.trim() || 'Aking luto');
      const rec = { id: uid(), rid, title, note: $('#pnote').value.trim(), d: $('#pgdate').value || todayKey(), stars: ui.photo.stars, img: ui.photo.img };
      gallery.unshift(rec);
      if (rid && RMAP[rid] && !coverOf(rid)) { state.covers[rid] = rec.id; save(); }
      idbDo('readwrite', st => st.put(rec)).then(ok => { if (!ok) toast('Saved for now, but this browser cannot keep photos'); });
      closeModal(); if (ui.tab === 'gallery') renderGallery(); else if (ui.tab === 'recipes') renderResults();
      toast('Photo saved 📸');
      break;
    }
    case 'photo-del': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again to delete'; break; }
      gallery = gallery.filter(g => g.id !== d.id);
      Object.keys(state.covers).forEach(k => { if (state.covers[k] === d.id) { const nx = gallery.find(g => g.rid === k); if (nx) state.covers[k] = nx.id; else delete state.covers[k]; } }); save();
      idbDo('readwrite', st => st.delete(d.id));
      closeModal(); if (ui.tab === 'gallery') renderGallery(); else if (ui.tab === 'recipes') renderResults();
      break;
    }
    case 'share-open': openShare(); break;
    case 'install': {
      if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); }
      else toast('Open the app link in Chrome (Android) or Safari (iPhone), then use the steps below it');
      break;
    }
    case 'share-app': {
      const data = { title: appName(), text: 'Filipino meal planner, budget, shopping list and timer', url: SHARE_URL };
      try { navigator.share(data).catch(() => { navigator.clipboard.writeText(SHARE_URL).then(() => toast('Link copied 🔗'), () => toast(SHARE_URL)); }); }
      catch (err) { try { navigator.clipboard.writeText(SHARE_URL).then(() => toast('Link copied 🔗'), () => toast(SHARE_URL)); } catch (e2) { toast(SHARE_URL); } }
      break;
    }
    case 'share-copy': try { navigator.clipboard.writeText(SHARE_URL).then(() => toast('Link copied 🔗'), () => toast(SHARE_URL)); } catch (err) { toast(SHARE_URL); } break;
    case 'dl-app': downloadApp(); break;
    case 'upd-check': checkUpdate(false); break;
    case 'upd-now': try { location.reload(); } catch (err) { toast('Reload the page to update'); } break;
    case 'bk-copy': { const code = exportCode(); try { navigator.clipboard.writeText(code).then(() => toast('Backup code copied ✓'), () => { $('#bcode').value = code; $('#bcode').select(); toast('Select and copy the code'); }); } catch (err) { $('#bcode').value = code; $('#bcode').select(); } break; }
    case 'bk-restore': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Tap again to replace my current data'; break; }
      try { importCode($('#bcode').value); closeModal(); render(); toast('Data restored ✓'); }
      catch (err) { t.dataset.armed = ''; t.textContent = 'Restore from code'; toast('That code did not work'); }
      break;
    }
    case 'ring-stop': stopRing(); state.timers = state.timers.filter(q => !q.done); save(); showRing(); renderTimerList(); break;
    case 'ring-snooze': stopRing(); state.timers.filter(q => q.done).forEach(q => { q.done = false; q.endAt = Date.now() + 60000; q.total = 60; }); save(); showRing(); renderTimerList(); tick(); break;
  }
});

document.addEventListener('toggle', e => { if (e.target && e.target.id === 'sgbox') ui.sgOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.target && e.target.id === 'q' && e.key === 'Enter') { e.preventDefault(); const b = document.querySelector('[data-act=do-search]'); if (b) b.click(); } });
document.addEventListener('search', e => { if (e.target && e.target.id === 'q') { ui.q = e.target.value; renderResults(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id && t.id.startsWith('cu-') && ui.themeDraft) {
    const k = { 'cu-name': 'name', 'cu-brand': 'brand', 'cu-accent': 'accent', 'cu-bg': 'bg' }[t.id];
    if (k) { ui.themeDraft[k] = t.value; applyTheme(ui.themeDraft); }
    return;
  }
  if (t.closest && t.closest('.srow') && (t.classList.contains('sq') || t.classList.contains('sa'))) { scCalc(t.closest('.srow')); return; }
  if (t.classList && t.classList.contains('rname')) { if (ingFind(t.value) || t.value === '') syncRow(t.closest('.rrow')); return; }
  if (t.id === 'q') { ui.q = t.value; renderResults(); }
  else if (t.id === 'maxb') { ui.maxb = Number(t.value) || 0; renderResults(); }
  else if (t.id === 'dbud') { ui.dailyBudget = t.value; }
  else if (t.id === 'pq' && ui.pick) { ui.pick.q = t.value; refreshPicker(); }
  else if (t.id === 'pbud' && ui.pick) { ui.pick.budget = t.value; ui.pick.sugg = suggest(ui.pick.slot, { budget: Number(t.value) || 0, date: ui.pick.date, n: 3 }).map(r => r.id); refreshPicker(); }
  else if (t.id === 'iq' && ui.items) { ui.items.q = t.value; refreshItems(); }
  else if (t.id === 'prq') { ui.pq = t.value; renderPriceList(); }
  else if (t.id === 'gq') { ui.gq = t.value; const pos = t.selectionStart; renderGallery(); const n = $('#gq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rcfile' || t.id === 'rcfile2' || t.id === 'rcfile3') { if (t.files && t.files[0]) scanFile(t.files[0]); return; }
  if (t.closest && t.closest('.srow')) {
    const row = t.closest('.srow');
    if (t.classList.contains('sid')) {
      const id = t.value, su = row.querySelector('.su'), us = id ? unitsFor(id) : ['g', 'kg', 'ml', 'L', 'pc'];
      su.innerHTML = us.map(u => `<option>${u}</option>`).join('');
      if (id) { su.value = ING[id][1] === 'kg' ? 'kg' : ING[id][1] === 'L' ? 'L' : ING[id][1]; row.querySelector('.son').checked = true; if (COUNT_UNITS.includes(ING[id][1]) && !row.querySelector('.sq').value) row.querySelector('.sq').value = 1; }
    }
    scCalc(row); return;
  }
  if (t.classList && t.classList.contains('rname')) { syncRow(t.closest('.rrow')); return; }
  if (t.classList && t.classList.contains('ru')) { syncRow(t.closest('.rrow'), true); return; }
  if (t.id === 'sort') { ui.sort = t.value; renderResults(); }
  else if (t.id === 'pfile' && t.files && t.files[0]) {
    resizeImage(t.files[0]).then(img => { ui.photo.img = img; const pr = $('#ppre'); pr.src = img; pr.hidden = false; }, () => toast('Could not read that photo'));
  }
  else if (t.id === 'pall' && ui.pick) { ui.pick.all = t.checked; refreshPicker(); }
  else if (t.id === 'bweek') { state.budgets.week = Number(t.value) || 0; save(); renderSpend(); }
  else if (t.id === 'bmonth') { state.budgets.month = Number(t.value) || 0; save(); renderSpend(); }
  else if (t.dataset && t.dataset.chk) { state.checked[t.dataset.chk] = t.checked; save(); if (ui.cl) refreshCL(); else if (ui.tab === 'shop') renderShop(); }
  else if (t.dataset && t.dataset.qty) {
    const id = t.dataset.qty, v = parseFloat(t.value);
    if (isNaN(v) || v < 0) { renderShop(); return; }
    const sh = shopData().items.find(x => x.id === id), du = dispUnit(id, sh ? sh.q : 1);
    state.qov[id] = v / unitFactor(id, du); save(); renderShop();
  }
  else if (t.dataset && t.dataset.du) { state.du[t.dataset.du] = t.value; save(); renderShop(); }
  else if (t.dataset && t.dataset.sprice) {
    const id = t.dataset.sprice, v = parseFloat(t.value);
    if (isNaN(v) || v < 0) { renderShop(); return; }
    const sh = shopData().items.find(x => x.id === id), du = dispUnit(id, sh ? sh.q : 1);
    const perBase = v * unitFactor(id, du);
    const base = storeOf(ING[id][3]) === 's' ? perBase / mult(ING[id][3]) : perBase;
    if (Math.abs(base - ING[id][2]) < 1e-9) delete state.prices[id]; else state.prices[id] = base;
    save(); renderShop();
  }
  else if (t.dataset && t.dataset.mult) { const v = parseFloat(t.value); if (!isNaN(v)) { state.mult[t.dataset.mult] = 1 + v / 100; save(); } }
  else if (t.dataset && t.dataset.price) {
    const v = parseFloat(t.value);
    if (isNaN(v) || v < 0) { t.value = basePrice(t.dataset.price); return; }
    if (v === ING[t.dataset.price][2]) delete state.prices[t.dataset.price]; else state.prices[t.dataset.price] = v;
    save();
  }
});

let theme = Object.assign({}, THEME0, LS.get('theme', {}));
const hex2 = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); const n = m ? parseInt(m[1], 16) : 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const toHex = r => '#' + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const mixc = (a, b, t) => { const x = hex2(a), y = hex2(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); };
const lumc = h => { const [r, g, b] = hex2(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
function applyTheme(t) {
  const s = document.documentElement.style, name = (t.name || '').trim() || THEME0.name;
  s.setProperty('--brand', t.brand); s.setProperty('--brand-d', mixc(t.brand, '#000000', .28)); s.setProperty('--brand-l', mixc(t.brand, '#ffffff', .82));
  s.setProperty('--leaf', t.accent); s.setProperty('--leaf-l', mixc(t.accent, '#ffffff', .88)); s.setProperty('--bg', t.bg);
  s.setProperty('--on-brand', lumc(t.brand) > .45 ? '#12302C' : '#ffffff');
  const sh = { sharp: ['6px', '4px', '6px'], rounded: ['14px', '10px', '999px'], pill: ['999px', '999px', '999px'] }[t.shape] || ['14px', '10px', '999px'];
  s.setProperty('--btn-r', sh[0]); s.setProperty('--btn-sm', sh[1]); s.setProperty('--chip-r', sh[2]);
  const an = document.getElementById('appname'); if (an) an.textContent = name;
  document.title = name + ' – Filipino Meal Planner';
  const tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', t.brand);
  const at = document.querySelector('meta[name=apple-mobile-web-app-title]'); if (at) at.setAttribute('content', name);
  try {
    if (/^https?:/.test(location.protocol)) {
      const mf = { name, short_name: name, start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''), display: 'standalone', orientation: 'portrait', background_color: t.bg, theme_color: t.brand,
        icons: [{ src: new URL('icon-192.png', location.href).href, sizes: '192x192', type: 'image/png' }, { src: new URL('icon-512.png', location.href).href, sizes: '512x512', type: 'image/png' }] };
      const lk = document.querySelector('link[rel=manifest]'); if (lk) lk.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
    }
  } catch (e) { /* ignore */ }
}
